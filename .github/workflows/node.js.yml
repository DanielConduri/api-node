name: Node.js CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
      - run: npm ci
      #- run: npm run build --if-present
      - run: npm install -g @angular/cli@16.2.16 # Install Angular CLI in the workflow environment
        working-directory: ./client
      - run: |
            cd client
            #npx npm-check-updates -u
            npm install
            ng build --configuration production

      # - name: Set up SSH
      #   uses: webfactory/ssh-agent@v0.5.3
      #   with:
      #     ssh-private-key: "${{ secrets.SSH_PRIVATE_KEY }}"
      # - run: |
      #       mkdir -p ~/.ssh
      #       echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
      #       chmod 600 ~/.ssh/id_rsa
      #       ssh-keyscan -H ec2-18-207-191-94.compute-1.amazonaws.com >> ~/.ssh/known_hosts
      #       cat ~/.ssh/known_hosts

      - run: |
            cd client
            sudo scp -o StrictHostKeyChecking=no -r ./dist /var/www/
            ls -R dist
            #rsync -avz  ./client/dist/client/  ubuntu@ec2-18-207-191-94.compute-1.amazonaws.com:/var/www/
            sudo systemctl restart nginx
